<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ADEZ MD — Pair</title>
<style>
  :root {
    --bg: #0b1120;
    --card: #131c31;
    --accent: #22c55e;
    --accent-dim: #16a34a;
    --text: #e5e7eb;
    --muted: #94a3b8;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #172038, var(--bg));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.06);
  }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    background: #0e1526;
    color: var(--text);
    font-size: 15px;
    margin-bottom: 16px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #06210f;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: var(--accent-dim); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status {
    margin-top: 20px;
    padding: 16px;
    border-radius: 10px;
    background: #0e1526;
    font-size: 14px;
    line-height: 1.6;
    display: none;
  }
  .status.show { display: block; }
  .code {
    font-size: 28px;
    letter-spacing: 4px;
    font-weight: 800;
    color: var(--accent);
    text-align: center;
    margin: 10px 0;
  }
  .error { color: var(--danger); }
  .code-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .copy-btn {
    width: auto;
    padding: 6px 10px;
    font-size: 13px;
    background: #1e293b;
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.12);
  }
  .copy-btn:hover { background: #273349; }
  .session-row { display: flex; align-items: flex-start; gap: 8px; margin-top: 8px; }
  .session-box {
    flex: 1;
    word-break: break-all;
    background: #06100a;
    border: 1px solid var(--accent);
    padding: 10px;
    border-radius: 8px;
    font-family: monospace;
    font-size: 12px;
  }
  .footer { margin-top: 20px; text-align: center; font-size: 12px; color: var(--muted); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent); margin-right:6px; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
</style>
</head>
<body>
  <div class="card">
    <h1>🔗 ADEZ MD — Pairing</h1>
    <div class="sub">Owner: ARNOLD ADEZ · Prefix: <b>.</b></div>

    <form id="pairForm">
      <label for="phone">WhatsApp number (with country code, digits only)</label>
      <input id="phone" type="tel" placeholder="e.g. 254111783552" required />
      <button id="submitBtn" type="submit">Generate Pairing Code</button>
    </form>

    <div id="status" class="status"></div>
    <div class="footer">Session ID will be sent to your own WhatsApp once linked.</div>
  </div>

<script>
  const form = document.getElementById("pairForm");
  const statusBox = document.getElementById("status");
  const submitBtn = document.getElementById("submitBtn");
  let poller = null;

  function showStatus(html) {
    statusBox.innerHTML = html;
    statusBox.classList.add("show");
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const phone = document.getElementById("phone").value.replace(/[^0-9]/g, "");
    if (phone.length < 9) {
      showStatus('<span class="error">Enter a valid number with country code.</span>');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Connecting...";
    showStatus('<span class="dot"></span> Requesting pairing code...');

    try {
      const res = await fetch("/api/pair", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone }),
      });
      const data = await res.json();

      if (!res.ok) {
        showStatus(`<span class="error">${data.error || "Something went wrong."}</span>`);
        submitBtn.disabled = false;
        submitBtn.textContent = "Generate Pairing Code";
        return;
      }

      showStatus(
        `Open WhatsApp → Linked Devices → Link with phone number, then enter:` +
        `<div class="code-row">` +
        `<div class="code" id="pairCode">${data.code || "----"}</div>` +
        `<button type="button" class="copy-btn" onclick="copyText('pairCode', this)">📋 Copy</button>` +
        `</div>` +
        `<span class="dot"></span> Waiting for you to complete linking...`
      );

      poller = setInterval(() => pollStatus(data.requestId), 2500);
    } catch (err) {
      showStatus('<span class="error">Network error. Is the server running?</span>');
      submitBtn.disabled = false;
      submitBtn.textContent = "Generate Pairing Code";
    }
  });

  async function pollStatus(requestId) {
    try {
      const res = await fetch(`/api/pair/status/${requestId}`);
      const data = await res.json();

      if (data.status === "ready") {
        clearInterval(poller);
        showStatus(
          `✅ <b>Linked!</b> Your session ID was also sent to your own WhatsApp chat.<br>` +
          `<div class="session-row">` +
          `<div class="session-box" id="sessionId">${data.sessionId}</div>` +
          `<button type="button" class="copy-btn" onclick="copyText('sessionId', this)">📋 Copy</button>` +
          `</div>` +
          `<div style="margin-top:10px;">Paste this into <b>deploy.html</b> to bring ADEZ MD online.</div>`
        );
      } else if (data.status === "error") {
        clearInterval(poller);
        showStatus(`<span class="error">${data.error}</span>`);
        submitBtn.disabled = false;
        submitBtn.textContent = "Generate Pairing Code";
      }
    } catch (err) {
      // keep polling silently
    }
  }

  function copyText(elementId, btn) {
    const text = document.getElementById(elementId).textContent;
    navigator.clipboard.writeText(text).then(() => {
      const original = btn.textContent;
      btn.textContent = "✅ Copied";
      setTimeout(() => { btn.textContent = original; }, 1500);
    }).catch(() => {
      btn.textContent = "Press Ctrl+C";
    });
  }
</script>
</body>
</html>
