<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#03060d"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f5ff"/>
      <stop offset="1" stop-color="#b400ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#00f5ff" stroke-opacity="0.07" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#grid)"/>
  <!-- hex frame -->
  <polygon points="512,90 880,300 880,724 512,934 144,724 144,300" fill="none" stroke="url(#neon)" stroke-width="10" filter="url(#glow)"/>
  <polygon points="512,140 836,326 836,698 512,884 188,698 188,326" fill="#050a14" fill-opacity="0.8" stroke="#00f5ff" stroke-opacity="0.35" stroke-width="3"/>
  <!-- robot head -->
  <rect x="332" y="330" width="360" height="270" rx="48" fill="none" stroke="url(#neon)" stroke-width="12" filter="url(#glow)"/>
  <line x1="512" y1="330" x2="512" y2="282" stroke="#00f5ff" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="512" cy="270" r="16" fill="#ff2bd6" filter="url(#glow)"/>
  <circle cx="432" cy="445" r="38" fill="#00f5ff" filter="url(#glow)"/>
  <circle cx="592" cy="445" r="38" fill="#00f5ff" filter="url(#glow)"/>
  <circle cx="432" cy="445" r="14" fill="#03060d"/>
  <circle cx="592" cy="445" r="14" fill="#03060d"/>
  <path d="M420 530 H604" stroke="#ff2bd6" stroke-width="10" stroke-linecap="round" stroke-dasharray="26 16" filter="url(#glow)"/>
  <!-- side ports -->
  <rect x="296" y="420" width="22" height="80" rx="8" fill="#b400ff" filter="url(#glow)"/>
  <rect x="706" y="420" width="22" height="80" rx="8" fill="#b400ff" filter="url(#glow)"/>
  <!-- text -->
  <text x="512" y="705" text-anchor="middle" font-family="Orbitron, 'Arial Black', Impact, sans-serif" font-weight="900" font-size="108" letter-spacing="10" fill="#00f5ff" filter="url(#glow)">ADEZ</text>
  <text x="512" y="780" text-anchor="middle" font-family="Orbitron, 'Arial Black', Impact, sans-serif" font-weight="700" font-size="58" letter-spacing="30" fill="#ff2bd6" filter="url(#glow)">MD</text>
</svg>
